name: gpu

# libtopaz-gl.dylib (the OpenGL ES library behind EAGLContext) and libtopaz-inject.dylib, the two
# pieces the window server needs to draw with CoreAnimation's GL renderer instead of not at all.
# Mesa is built here too (25.0.7, softpipe = CPU; freedreno = the Adreno, which needs gpu=1 and the
# firmware in the root filesystem).

on:
  workflow_dispatch:
    inputs:
      drivers:
        description: Mesa gallium drivers (softpipe, or softpipe,freedreno)
        default: "softpipe,freedreno"
  push:
    branches: [main]
    paths:
      - "userland/gpu/**"
      - "userland/mesa/**"
      - "userland/mkeagl.py"
      - ".github/workflows/gpu.yml"

permissions:
  contents: write

concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: true

env:
  MESA_VERSION: "25.0.7"
  DRIVERS: ${{ inputs.drivers || 'softpipe,freedreno' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          clang --version | head -2

      - name: Install build tools
        run: |
          brew install meson ninja bison >/dev/null
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"

      - name: Cache Mesa build
        uses: actions/cache@v4
        with:
          path: |
            userland/mesa/build-mesa/mesa-${{ env.MESA_VERSION }}.tar.xz
            userland/mesa/build-mesa/build-softpipe-freedreno
            userland/mesa/build-mesa/build-softpipe
            userland/mesa/build-mesa/venv
          key: mesa-${{ env.MESA_VERSION }}-softpipe-freedreno-${{ hashFiles('userland/mesa/*.patch', 'userland/mesa/redwood-drm/*') }}

      - name: Build Mesa (OSMesa, GLES profile, ${{ env.DRIVERS }})
        run: |
          export DRIVERS="$DRIVERS"
          bash userland/mesa/mk-mesa-mac.sh
          ls -l userland/mesa/build-mesa/out

      - name: Build the shim
        run: |
          MESA="$PWD/userland/mesa/build-mesa/out" bash userland/gpu/build.sh "$PWD/out-gpu"
          cat out-gpu/MANIFEST.sha256

      # Release assets, not workflow artifacts: the rootfs image alone fills the artifact quota.
      - name: Publish (release gpu-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=gpu-latest
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "OpenGL ES shim for backboardd (latest)" \
              --notes "libtopaz-gl.dylib, libtopaz-inject.dylib and libOSMesa.8.dylib for iOS 16.7.16 (20H392), built by the gpu workflow. Download with: gh release download gpu-latest"
          gh release upload "$TAG" out-gpu/libtopaz-gl.dylib out-gpu/libtopaz-inject.dylib \
            out-gpu/libOSMesa.8.dylib out-gpu/MANIFEST.sha256 --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) B"' 